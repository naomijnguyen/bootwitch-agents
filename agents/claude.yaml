interface:
  display_name: "AGENTS"
  short_description: "Coordinate parallel agents through shared evidence"
  default_prompt: "Use the agents skill to start or continue a multi-agent coding session with bounded assignments, architecture traces, append-only shared notes, and verified handoffs."

install:
  method: git
  repository: "https://github.com/naomijnguyen/bootwitch-agents.git"
  target: "~/.claude/skills/bootwitch-agents"
  command: "git clone https://github.com/naomijnguyen/bootwitch-agents.git ~/.claude/skills/bootwitch-agents"
  invoke: "/bootwitch-agents"
